id: BC-000001
title: Stale StateStore snapshot reused after await
status: confirmed
created_at: '2026-09-10T00:00:00+00:00'
language: python
subsystem: state-store
severity: high
confidence: high
source: constructed-fixture
source_reference: .bugcorpus/corpus/BC-000001/
bad_commit: ''
good_commit: ''
symptom: request handler returns stale object state after concurrent update
user_impact: clients observe outdated data; writes based on stale reads can clobber
  newer state
root_cause: snapshot obtained before an await is reused after another task may invalidate
  that snapshot
violated_invariant: Snapshot objects returned by snapshot acquisition calls may not
  be dereferenced after a suspension point unless refreshed after the final await.
required_preconditions:
- snapshot object is invalidated by concurrent tasks
- function suspends at an await between acquire and use
triggering_operation: concurrent mutation of the snapshotted state during the await
incorrect_behavior: use pre-await snapshot after await
correct_behavior: reacquire the snapshot after the final await before use
semantic_signature:
  kind: use-after-suspension
  acquire:
    call_matches: snapshot
  invalidating_boundary: await expression
  forbidden_use: attribute access or passing of the acquired object
  allowed_if: object is reacquired after the final await
