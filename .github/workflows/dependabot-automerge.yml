# trace:v1 id=op.bugcorpus-automerge.name work=WORK-BUG-ZJBDCZZ0 satisfies=REQ-BUG-WSZJ7M37
name: dependabot-automerge
# trace:v1 id=op.bugcorpus-automerge.triggers work=WORK-BUG-ZJBDCZZ0 satisfies=REQ-BUG-WSZJ7M37
on:
  pull_request:
    types: [opened, synchronize, reopened]
# trace:v1 id=op.bugcorpus-automerge work=WORK-BUG-ZJBDCZZ0 satisfies=REQ-BUG-WSZJ7M37
jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write}
    steps:
      - uses: dependabot/fetch-metadata@v2
        id: meta
        with: {github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          PR_URL: ${{ github.event.pull_request.html_url }}
