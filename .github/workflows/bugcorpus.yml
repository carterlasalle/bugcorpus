# trace:v1 id=op.bugcorpus-ci.name work=WORK-BUG-ZJBDCZZ0 satisfies=REQ-BUG-WSZJ7M37
name: bugcorpus
# trace:v1 id=op.bugcorpus-ci.triggers work=WORK-BUG-ZJBDCZZ0 satisfies=REQ-BUG-WSZJ7M37
on:
  pull_request:
    paths: ["bugcorpus/**", ".bugcorpus/**", "tests/**", "skills/bug-corpus/**", "adapters/**", ".claude/**", ".codex/**", ".agents/**", ".omp/**", ".mcp.json", ".github/**"]
  push:
    branches: [main, master]
  schedule: [{cron: "0 6 * * 1"}]
  workflow_dispatch:
# trace:v1 id=op.bugcorpus-ci work=WORK-BUG-ZJBDCZZ0 satisfies=REQ-BUG-WSZJ7M37
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - run: uv sync --group dev
      - run: uv run pytest tests/ -q
      - run: uv run bugcorpus verify
      - run: uv run bugcorpus adapters install --check
  scan-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run bugcorpus scan --profile pr
  scan-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run bugcorpus scan --profile full
