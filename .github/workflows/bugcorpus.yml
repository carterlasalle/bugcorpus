# trace:v1 id=op.bugcorpus-ci.name work=WORK-BUG-ZJBDCZZ0 satisfies=REQ-BUG-WSZJ7M37
name: bugcorpus
# trace:v1 id=op.bugcorpus-ci.triggers work=WORK-BUG-ZJBDCZZ0 satisfies=REQ-BUG-WSZJ7M37
on:
  pull_request:
    paths: ["bugcorpus/**", ".bugcorpus/**", "tests/**", "skills/bug-corpus/**", "adapters/**", ".claude/**", ".codex/**", ".agents/**", ".omp/**", ".mcp.json", ".github/**", "**.md", "docs/**"]
  push:
    branches: [main, master]
  schedule: [{cron: "0 6 * * 1"}]
  workflow_dispatch:
# trace:v1 id=op.bugcorpus-ci work=WORK-BUG-ZJBDCZZ0 satisfies=REQ-BUG-WSZJ7M37
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - run: uv sync --group dev
      - run: uvx ruff@latest check bugcorpus/ tests/
      - run: uvx ruff@latest format --check bugcorpus/ tests/
      - run: uv run --with pyright -- pyright bugcorpus/ tests/ .bugcorpus/detectors/
      - run: uv run pytest tests/ -q
      - run: uv run bugcorpus verify
      - run: uv run bugcorpus adapters install --check
  scan-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run bugcorpus scan --profile pr
  scan-annotations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, checks: write}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - uses: reviewdog/action-setup@v1
      - run: uv run bugcorpus export sarif --profile pr > findings.sarif
      - run: reviewdog -f=sarif -reporter=github-pr-review -level=warning -fail-level=error < findings.sarif
        env: {REVIEWDOG_GITHUB_API_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  scan-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run bugcorpus scan --profile full
