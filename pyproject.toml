[project]
name = "bugcorpus"
version = "0.1.1"
description = "Compiler from historical bugs into permanent deterministic detectors"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]
readme = "README.md"
license = "MIT"
authors = [{name = "Carter LaSalle"}]
keywords = ["static-analysis", "bug-detection", "semgrep", "ast-grep", "codeql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
[project.urls]
Homepage = "https://github.com/carterlasalle/bugcorpus"
Repository = "https://github.com/carterlasalle/bugcorpus"
Issues = "https://github.com/carterlasalle/bugcorpus/issues"

[project.scripts]
bugcorpus = "bugcorpus.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bugcorpus"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "bugcorpus_data/skills"
"adapters" = "bugcorpus_data/adapters"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Corpus fixtures are intentionally minimized snippets with unresolved
# names (~15 lines preserving one property); they are detector test data.
".bugcorpus/**/fixtures/**/*.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
